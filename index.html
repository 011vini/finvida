<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/estilos.css">
    <link rel="shortcut icon" href="./IMAGES/favicon2.ico" type="image/x-icon">
    <title>Orçamente</title>
</head>

<body>
    <header class="top-header">
        <div class="logo-area">
            <img src="./IMAGES/Orçamente-logo.png" alt="Logo Orçamente" class="logo">
            <h1>Orçamente</h1>
        </div>

        <nav class="menu">
            <a href="#" id="btnPerfil">Perfil</a>
        </nav>

        <!-- ===== MODAL DO PERFIL ===== -->
        <div id="modalPerfil" class="modal">
            <div class="modal-content">
                <span class="close" id="fecharPerfil">&times;</span>

                <h2>Perfil do Usuário</h2>
                <p id="perfilNome"></p>

                <hr>

                <!-- Adicionar Dinheiro -->
                <div class="perfil-box">
                    <h3>Adicionar Dinheiro ao Saldo</h3>
                    <input type="number" id="valorAdicionar" placeholder="Valor para adicionar">
                    <button id="btnAdicionar">Adicionar</button>
                </div>

                <hr>

                <!-- Saldo do Último Mês -->
                <div class="perfil-box">
                    <h3>Fechar Mês</h3>
                    <button id="btnFecharMes">Registrar saldo do mês</button>
                </div>

                <hr>
                <!-- Resetar sistema financeiro -->
                <div class="perfil-box">
                    <h3>Resetar Financeiro</h3>
                    <button id="btnResetar">Resetar Tudo</button>
                </div>
                <button id="btnSair" class="sair">Sair</button>
            </div>
        </div>
    </header>

    <h1 id="logado"></h1>
    <p>Bem-vindo ao Orçamente!</p>
    <p>Seu assistente pessoal para orçamentos e finanças.</p>



    <section class="cards-container">

        <!-- CARD 1 — SALDO TOTAL -->
        <div class="card card-saldo">
            <h2>Saldo Total</h2>

            <div class="saldo-box">
                <span class="saldo-valor" id="saldoAtual">R$ 5.850,00</span>
            </div>

            <p class="saldo-mes-anterior">
                Último mês: <span id="saldoAnterior">R$ 2.100,00</span>
            </p>
        </div>


        <!-- CARD 2 — ADICIONAR GASTO -->
        <div class="card card-gasto">
            <h2>Adicionar Novo Gasto</h2>

            <label for="descricao">Descrição do Gasto</label>
            <input type="text" id="descricao" placeholder="Ex: Supermercado">

            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" min="0" step="0.01" placeholder="0.00">

            <label for="categoria">Categoria</label>
            <select id="categoria">
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Moradia">Moradia</option>
                <option value="Educação">Educação</option>
                <option value="Lazer">Lazer</option>
                <option value="Saúde">Saúde</option>
                <option value="Outros">Outros</option>
                <label for="data">Data</label>
                <input type="date" id="data">
                <button id="btnSalvarGasto">Salvar Gasto</button>
            </select>
        </div>


        <!-- CARD 3 — HISTÓRICO DE GASTOS -->
        <div class="card card-historico">
            <h2>Histórico de Gastos</h2>
            <div class="filtros">
                <select id="filtroCategoria">
                    <option value="todas">Todas as categorias</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Educação">Educação</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Outros">Outros</option>
                </select>

                <input type="date" id="filtroDataInicio">
                <input type="date" id="filtroDataFim">

                <select id="filtroOrdenar">
                    <option value="">Ordenar</option>
                    <option value="valorAsc">Valor (menor → maior)</option>
                    <option value="valorDesc">Valor (maior → menor)</option>
                    <option value="dataAsc">Data (mais antigo → mais recente)</option>
                    <option value="dataDesc">Data (mais recente → mais antigo)</option>
                </select>
            </div>

            <div class="lista-gastos" id="listaGastos">
                <!-- Os itens serão adicionados aqui pelo JS -->
            </div>
        </div>

        <!-- CARD 4 — GRÁFICO DE GASTOS -->
        <div class="card card-grafico">
            <h2>Gastos por Categoria</h2>
            <canvas id="graficoGastos"></canvas>
        </div>


    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="./JS/Dashboard.js/financeiro.js"></script>

    <script src="./JS/Dashboard.js/card1.js"></script>
    <script src="./JS/Dashboard.js/card2.js"></script>
    <script src="./JS/Dashboard.js/card3.js"></script>
    <script src="./JS/Dashboard.js/card4.js"></script>

    <script src="./JS/index.js"></script>

</body>

</html>
